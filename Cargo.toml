[package]
name = "ms-icpr"
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/icedracon/ms-icpr"
authors = ["zevs"]
description = "MS-ICPR / MS-WCCE client for AD CS enrollment with an ESC1 CSR SubjectAltName UPN-injection primitive"
readme = "README.md"
homepage = "https://github.com/icedracon/ms-icpr"
documentation = "https://docs.rs/ms-icpr"
keywords = ["active-directory", "adcs", "icpr", "esc1", "certificate"]
categories = ["authentication", "cryptography", "network-programming"]

[features]
default = ["network"]
# When enabled: sealed \PIPE\cert transport (needs a live DC to actually work,
# but always compiles). Disable for offline-only builds that just want the
# CSR builder + wire-format encoder.
network = ["dep:dcerpc", "dep:smb2-client", "dep:tokio"]

[dependencies]
ms-crtd = { path = "../ms-crtd", version = "0.1.0-dev" }
ms-ndr = "0.1"
dcerpc = { version = "0.2", optional = true }
smb2-client = { version = "0.2", optional = true }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"], optional = true }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand = "0.8"

[lib]
name = "ms_icpr"
path = "src/lib.rs"
