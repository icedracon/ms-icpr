[package]
name = "ms-icpr"
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "ICertPassage / MS-ICPR client with ESC1 CSR-SAN-injection primitive (pre-alpha)"
keywords = ["adcs", "icpr", "wcce", "esc1", "certificate"]
categories = ["authentication", "cryptography"]

[dependencies]
ms-crtd = { path = "../ms-crtd" }
dcerpc = "0.2"
ms-ndr = "0.1"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand = "0.8"

[lib]
name = "ms_icpr"
path = "src/lib.rs"
